<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="live_call — talk to your Hermes agent on a real voice call">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a1a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#2f6fed"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="#0d131c"/>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="980" cy="200" r="230" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#171f2b">
    <path d="M0 100h1280M0 200h1280M0 300h1280"/>
    <path d="M160 0v400M320 0v400M480 0v400M640 0v400M800 0v400M960 0v400M1120 0v400"/>
  </g>

  <!-- ── left: wordmark + pitch ─────────────────────────────────────────── -->
  <g transform="translate(88,116)">
    <text x="0" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="66" font-weight="700" fill="#e8ecf1">
      live_call
    </text>
    <rect x="2" y="20" width="196" height="5" rx="2.5" fill="#3ddc84"/>
    <rect x="2" y="20" width="196" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="0" y="78" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="29" fill="#c7d2de">
      Talk to your Hermes agent
    </text>
    <text x="0" y="116" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="29" fill="#c7d2de">
      on a real voice call.
    </text>

    <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" fill="#8fa3b8">
      <text x="0" y="160">One-time link · self-hosted room · your assistant’s own</text>
      <text x="0" y="186">persona, memory and the chat that asked for the call.</text>
    </g>
  </g>

  <!-- ── right: chat bubble → phone ─────────────────────────────────────── -->
  <g transform="translate(792,52)">
    <!-- incoming request bubble -->
    <g>
      <rect x="0" y="10" width="252" height="58" rx="16" fill="#182231" stroke="#25344a"/>
      <text x="20" y="46" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" fill="#dbe4ee">“call me”</text>
    </g>

    <!-- link bubble from the agent -->
    <g>
      <rect x="26" y="88" width="290" height="60" rx="16" fill="#14301f" stroke="#2c6b46"/>
      <text x="46" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8ee9b4">tap to join ↗</text>
      <text x="46" y="138" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#4f8f6c">…/join/one-time-token</text>
    </g>

    <!-- connector -->
    <path d="M170 152 C170 186, 214 186, 214 214" stroke="#2f6fed" stroke-width="3" fill="none" stroke-dasharray="7 7" opacity=".8"/>

    <!-- phone -->
    <g transform="translate(150,214)">
      <rect x="0" y="0" width="128" height="112" rx="18" fill="#0e1621" stroke="#2b3a51" stroke-width="2"/>
      <rect x="46" y="10" width="36" height="6" rx="3" fill="#22314a"/>
      <!-- waveform = live audio -->
      <g stroke="#3ddc84" stroke-width="5" stroke-linecap="round" filter="url(#soft)" opacity=".55">
        <path d="M28 62v-14M46 68v-26M64 74v-38M82 68v-26M100 62v-14"/>
      </g>
      <g stroke="#3ddc84" stroke-width="5" stroke-linecap="round">
        <path d="M28 62v-14M46 68v-26M64 74v-38M82 68v-26M100 62v-14"/>
      </g>
    </g>
  </g>

  <!-- ── footer strip ───────────────────────────────────────────────────── -->
  <g transform="translate(88,358)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#7f93a8">
    <rect x="0" y="-9" width="8" height="8" rx="2" fill="#3ddc84" opacity=".85"/>
    <text x="16" y="0">audio over WSS — works behind any NAT</text>
    <rect x="290" y="-9" width="8" height="8" rx="2" fill="#3ddc84" opacity=".85"/>
    <text x="306" y="0">single-use, expiring links</text>
    <rect x="530" y="-9" width="8" height="8" rx="2" fill="#3ddc84" opacity=".85"/>
    <text x="546" y="0">transcripts stay on your disk</text>
  </g>
</svg>
